<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title> Natomanija </title>
</head>
<body>
    <h1> Natomanija </h1>
    <form id="transpose-form">
        <label for="progression">Akordu seka:</label>
        <textarea id="progression" name="progression" required>C Am F G</textarea>

        <label for="steps">Poslinkis pustoniais:</label>
        <button type="button" id="minus">-</button>
        <input id="steps" name="steps" type="number" value="0" required>
        <button type="button" id="plus">+</button>

        <button type="submit">Transponuoti</button>
    </form>
    <p id="result" aria-live="polite"></p>


    <h2> <> <> <> <> <> <> <> <> <> <> </h2>
    <form id="transpose-by-key-form">
        <label for="startKey"> Pradinė tonacija </label>
        <input id="startKey" name="startKey" value="C" required>

        <label for="endKey"> Tikslinė tonacija </label>
        <input id="endKey" name="endKey" value="A" required>

        <label for="key-progression"> Akordų seka </label>
        <textarea id="key-progression" name="progression" required> C Am F G</textarea>

        <button type="submit"> Transponuoti </button>
    </form>
    <p id="key-result" aria-live="polite"></p>

<script src="app.js"></script>
</body>
</html>
